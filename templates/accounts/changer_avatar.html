{% extends "base.html" %}

{% block title %}Changer mon avatar — PokéMarket{% endblock %}

{% block content %}
<div class="card">
    <h1 style="color: #4a1472;">🎨 Changer mon avatar</h1>

    <form method="post">
        {% csrf_token %}

        <div class="form-group autocomplete-wrapper">
            <label for="avatar-search">Choisis ton Pokémon</label>
            <input type="text"
                   id="avatar-search"
                   name="q"
                   placeholder="Tape un nom... ex: Poussacha"
                   autocomplete="off"
                   hx-get="{% url 'marketplace:autocomplete_pokemon' %}"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#avatar-resultats">
            <div id="avatar-resultats" class="autocomplete-resultats"></div>
            <input type="hidden" name="pokemon_avatar_id" id="id_pokemon_avatar_id"
                   value="{{ user.pokemon_avatar_id|default:'' }}">
        </div>

        <div id="avatar-choix" class="pokemon-choisi"
             style="{% if not user.pokemon_avatar_id %}display:none{% endif %}">
            ✅ Pokémon sélectionné : <strong id="avatar-nom-affiche"></strong>
            <button type="button" onclick="effacerChoixAvatar()">✏️</button>
        </div>

        <div class="form-group">
            <label>Choisis une couleur de fond</label>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                {% for couleur in couleurs %}
                <label style="cursor: pointer;">
                    <input type="radio" name="avatar_couleur" value="{{ couleur }}"
                           {% if user.avatar_couleur == couleur %}checked{% endif %}
                           style="display: none;">
                    <span style="display: inline-block; width: 40px; height: 40px;
                                  border-radius: 50%; background: {{ couleur }};
                                  border: 2px solid #212121;"></span>
                </label>
                {% endfor %}
            </div>
        </div>

        <button type="submit" class="btn">💾 Enregistrer</button>
    </form>
</div>

<script>
function choisirPokemon(id, nom, element) {
    const resultats = element.closest('.autocomplete-resultats');
    const cible = resultats.id.replace('-resultats', '');

    if (cible === 'cherche') {
        document.getElementById('id_pokemon_cherche_id').value = id;
    } else if (cible === 'propose') {
        document.getElementById('id_pokemon_propose_id').value = id;
    } else if (cible === 'avatar') {
        document.getElementById('id_pokemon_avatar_id').value = id;
    }

    document.getElementById(cible + '-nom-affiche').textContent = '#' + id + ' — ' + nom;
    document.getElementById(cible + '-search').value = '';
    resultats.innerHTML = '';

    document.getElementById(cible + '-choix').style.display = 'block';
    document.getElementById(cible + '-search').style.display = 'none';
}

function effacerChoixAvatar() {
    document.getElementById('id_pokemon_avatar_id').value = '';
    document.getElementById('avatar-choix').style.display = 'none';
    document.getElementById('avatar-search').style.display = 'block';
    document.getElementById('avatar-search').focus();
}
</script>
{% endblock %}
