<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PokéMarket{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #fdfbff;
            color: #212121;
            min-height: 100vh;
        }
        header {
            background: #4a1472;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: #ede7f6;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
        }
        nav a {
            color: #ede7f6;
            text-decoration: none;
            margin-left: 1rem;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .messages { margin-bottom: 1rem; }
        .message-success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 0.8rem 1rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
        .message-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 0.8rem 1rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .btn {
            background: #7030a0;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #4a1472; }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: bold;
            color: #4a1472;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7030a0;
        }
        .error-text {
            color: #f44336;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="/">🎮 PokéMarket</a>
        <nav>
            {% if user.is_authenticated %}
                <a href="/">Tableau de bord</a>
                <a href="/auth/deconnexion/">Déconnexion</a>
            {% else %}
                <a href="/auth/connexion/">Connexion</a>
                <a href="/auth/inscription/">Inscription</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
